[project]
name = "equity-research-agent"
version = "0.1.0"
description = "An agentic equity-research assistant: RAG over filings + live market data + web news, with a fact-checking verifier agent."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "faiss-cpu>=1.13.0",
    "fastapi[standard]>=0.122.0",
    "langchain>=1.1.0",
    "langchain-community>=0.4.1",
    "langchain-groq>=1.1.0",
    "langchain-huggingface>=1.1.0",
    "langchain-litellm>=0.3.2",
    "langsmith>=0.4.0",
    "numpy>=2.0.0",
    "pydantic>=2.0.0",
    "pypdf>=5.0.0",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "sentence-transformers>=5.1.2",
    "sentry-sdk>=2.0.0",
    "streamlit>=1.51.0",
    "torch>=2.9.1",
    "yfinance>=0.2.40",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
